events { worker_connections 1024; }

http {
  server {
    listen 80;

    location /v1/ {
      proxy_pass http://gateway:3000;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Request-Id $request_id;
      proxy_buffering off;
      proxy_read_timeout 300s;
      client_max_body_size 1m;
    }

    location /admin/ {
      # In production: uncomment and set your IP
      # allow <your-ip>;
      # deny all;
      proxy_pass http://gateway:3000;
      proxy_set_header X-Request-Id $request_id;
    }

    location /healthz {
      proxy_pass http://gateway:3000;
    }

    location /readyz {
      proxy_pass http://gateway:3000;
    }
    # /metrics is NOT proxied here — Prometheus scrapes the container directly
  }
}

