name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/llm-gateway:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/llm-gateway:latest

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Deploy when host secrets are configured
        if: ${{ env.DEPLOY_HOST != '' && env.DEPLOY_USER != '' && env.DEPLOY_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/llm-gateway
            GATEWAY_IMAGE=ghcr.io/${{ github.repository_owner }}/llm-gateway IMAGE_TAG=${{ github.sha }} docker compose pull gateway
            GATEWAY_IMAGE=ghcr.io/${{ github.repository_owner }}/llm-gateway IMAGE_TAG=${{ github.sha }} docker compose up -d --no-deps gateway
